# Pack the dsh release sequence: every package under packages/ plus the apps/
# entries, all on one version. The vendored framework and the native packages are
# separate sequences with their own workflows and version lines.
#
# Pack runs without credentials on every pull request and master push, so a
# pull request proves the whole publish set still packs. Publication is a manual
# workflow_dispatch of release-publish.yml from a dsh-v* tag.
#
# The dsh npm sequence is currently blocked inside the repository itself:
# scripts/release/families.ts refuses to pack the family until Host build
# artifact provenance is recorded (asserted by scripts/release/families.spec.ts).
# This workflow therefore verifies the version and the Host build, reports that
# documented block as a notice instead of a stack trace, and only runs the pack
# verification chain once a pack actually produced tarballs.
name: Release (dsh)

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Pack runs per ref so concurrent pull requests never displace each other.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  PRIMARY_NODE_VERSION: '24'
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  pack:
    name: Pack npm tarballs
    runs-on: ubuntu-24.04
    steps:
      # Complete history: the release scripts read tags.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}

      - name: Configure pnpm store path
        id: pnpm-store
        run: |
          store_root="$HOME/.local/share/pnpm/store"
          echo "PNPM_CONFIG_STORE_DIR=$store_root" >> "$GITHUB_ENV"
          store_path=$(PNPM_CONFIG_STORE_DIR="$store_root" pnpm store path --silent)
          echo "path=$store_path" >> "$GITHUB_OUTPUT"

      - uses: actions/cache/restore@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-node-${{ env.PRIMARY_NODE_VERSION }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ env.PRIMARY_NODE_VERSION }}-pnpm-

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      - name: Verify release version
        run: pnpm run release:verify --family dsh

      # One build owner: scripts/build-host-bundles.ts (also reachable as
      # `pnpm run build`, and the step release-vendor.yml already runs). The
      # packed tarballs carry its lib/ output, so the dsh sequence builds through
      # the same script instead of a separate official-build entry point.
      - name: Build
        run: pnpm run build:lib:host

      # verifyBuildArtifacts fails on any declared entry the build did not produce
      # (that failure is a real defect and still fails this step), then refuses to
      # pack until the Host build artifact provenance is recorded. Only that exact
      # documented block is reported as the expected outcome.
      - name: Pack release tarballs
        id: pack-dsh
        run: |
          set -o pipefail
          log="$RUNNER_TEMP/pack-dsh.log"
          if pnpm run release:pack --family dsh --out dist/npm > "$log" 2>&1; then
            packed=true
            tail -3 "$log"
          elif grep -qF 'Host build artifact provenance is not yet recorded' "$log"; then
            packed=false
            echo "::notice::dsh npm release is blocked by design: Host build artifact provenance is not recorded in this repository. Version and Host build verified; no dsh tarball was produced."
          else
            cat "$log"
            exit 1
          fi
          echo "packed=$packed" >> "$GITHUB_OUTPUT"

      # The harness packages declare the vendored framework as a peer, and this
      # verification must not depend on the registry already carrying matching
      # versions — one pull request may bump both families before either
      # publishes — so it installs that family's pack output too. Only dist/npm
      # is published. These steps need dsh tarballs a blocked pack cannot produce.
      - name: Pack the vendored framework for verification
        if: steps.pack-dsh.outputs.packed == 'true'
        run: pnpm run release:pack --family vendor --out dist/npm-vendor

      # dsh-sandbox-local declares the Landlock entry as a runtime dependency, so
      # the verification needs its tarball. Its platform packages stay out: they
      # are optional, and building them needs a musl toolchain per architecture.
      - name: Pack the Landlock entry for verification
        if: steps.pack-dsh.outputs.packed == 'true'
        run: |
          pnpm --dir native/landlock-run run build:ts
          pnpm --dir native/landlock-run/packages/entry pack --pack-destination "$PWD/dist/npm-landlock"

      - name: Verify packed install
        if: steps.pack-dsh.outputs.packed == 'true'
        run: pnpm run release:verify-packed-install --family dsh --from dist/npm --from dist/npm-vendor --from dist/npm-landlock

      - uses: actions/upload-artifact@v4
        if: steps.pack-dsh.outputs.packed == 'true'
        with:
          name: dsh-npm-tarballs
          path: dist/npm/*
          if-no-files-found: error
          retention-days: 7
