name: Source privacy

on:
  workflow_call:

permissions:
  contents: read

jobs:
  source-privacy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Scan introduced commit trees for personal state
        shell: bash
        env:
          SCAN_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          SCAN_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/verify-generated-tracking.ts --history-base "$SCAN_BASE" --history-head "$SCAN_HEAD"
      - name: Scan source history for credentials
        shell: bash
        run: |
          set -euo pipefail
          scan_dir="$(mktemp -d "$RUNNER_TEMP/ark-gitleaks.XXXXXX")"
          trap 'rm -rf "$scan_dir"' EXIT
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$scan_dir/gitleaks.tar.gz"
          printf '%s  %s\n' \
            551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb \
            "$scan_dir/gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf "$scan_dir/gitleaks.tar.gz" -C "$scan_dir" gitleaks
          "$scan_dir/gitleaks" git . --log-opts=--all --redact=100 --config .gitleaks.toml
