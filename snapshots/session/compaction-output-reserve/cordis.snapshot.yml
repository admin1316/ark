# Keyless proactive compaction; 128000 - 119487 = 8513 input tokens.
# The fixture offsets the measured 213-token header cost of literal stdin;
# production budgets and the compaction threshold, retention, and summary cap are unchanged.

- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  disabled: true

- id: session-persistence-jsonl
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js dshHomePath('sessions')
    compression: none

- id: compaction-basic
  name: '@deepseek-ai/dsh-compaction-basic'
  config:
    thresholdRatio: 0.99
    retainTokens: 20
    maxTokens: 32

- insert:
    - id: llm-replay
      name: '@deepseek-ai/dsh-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash
                contextWindow: 128000
                defaultMaxTokens: 119487
