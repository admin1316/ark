# Replay patch shared by the ordinary headless snapshot composition. The model
# script comes from the scenario's committed session JSONL.

- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  disabled: true

- id: plugin-package-inventory-deepseek
  disabled: true

- id: session-title-llm
  disabled: true

- id: session-persistence-jsonl
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js dshHomePath('sessions')
    compression: none

- id: sandbox
  name: '@deepseek-ai/dsh-sandbox-local'
  config:
    runnerCommand:
      - bash
      - -c
      - while [ "$1" != "--" ]; do shift; done; shift; exec "$@"
      - passthrough-runner
    runnerFailureSignatures:
      - 'passthrough-runner: profile rejected'

- insert:
    - id: llm-replay
      name: '@deepseek-ai/dsh-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash
              - id: deepseek-v4-pro

# No trusted verifier is configured. Only the durable ingestion consumer is exposed.

- id: headless-runner
  inject: [headlessStartup, knowledgeWikiIngestionOnlyReady]
  config:
    task: !!js ctx.headlessStartup.task

- insert:
    - id: knowledge-wiki
      name: '@deepseek-ai/dsh-knowledge-wiki'
      config:
        mainRoot: !!js process.cwd()
        wikiRoot: !!js process.cwd() + '/wiki'
        credential: ''
        ownedStageExecutor: false
        knowledgeSearchCandidateMode: disabled
        knowledgeVerifierConfig: ''

    - id: tool-knowledge-wiki
      name: '@deepseek-ai/dsh-tool-knowledge-wiki'
      config:
        exposeGovernedTools: false

    - id: wiki-ingestion-only-gate
      name: '../../../examples/headless-agent/tests/fixtures/knowledge-wiki/ingestion-only.ts'
