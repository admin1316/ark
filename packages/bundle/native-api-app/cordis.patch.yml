# The native API application is a multi-session Host composition over dsh-base.
# It mounts only services used by native clients: no frontend fallback, module
# roster, Client runner, browser runtime, UI plugin, or default-browser handoff.

# Long-lived multi-session products compose model-facing rows per Agent preset.
- id: hmr
  disabled: true
- id: tool-bash
  disabled: true
- id: tool-pwsh
  disabled: true
- id: tool-jobs
  disabled: true
- id: tool-fs
  disabled: true
- id: tool-fs-search
  disabled: true
- id: tool-str-replace-editor
  disabled: true
- id: skill-filesystem
  disabled: true
- id: tool-skill
  disabled: true
- id: tool-goal
  disabled: true
- id: plan-mode
  disabled: true
- id: compaction-basic
  disabled: true
- id: command-compact
  disabled: true
- id: tool-result-pruner
  disabled: true
- id: tool-subagent-control
  disabled: true
- id: tool-subagent-list-agents
  disabled: true
- id: tool-subagent
  disabled: true
- id: tool-subagent-fork
  disabled: true
- id: workflow-worker-thread
  disabled: true
- id: tool-workflow
  disabled: true
- id: tool-ralph
  disabled: true
- id: agent-instructions
  disabled: true
- id: tool-todo
  disabled: true
- id: tool-web
  # WebFetch providers stay on the Host; standard/code mount the model-facing
  # tools in their Agent scopes. Do not register a second global tool surface.
  disabled: true
  config:
    fetch: true
    searchTimeoutMs: 60000

# file-reference-local owns the implementation but its generated Remote
# descriptor belongs to dsh-file-reference. Register that contract artifact
# explicitly so Native HTTP can dispatch fileReferences/list through the live
# local owner without making any browser/client package visible.
- id: typert-loader
  config:
    packages:
      - '@deepseek-ai/dsh-credentials'
      - '@deepseek-ai/dsh-file-reference'
      - '@deepseek-ai/dsh-settings'

- insert:
    - id: code-runtime
      name: '@deepseek-ai/dsh-code-runtime-worker-thread'

    - id: storage
      name: '@deepseek-ai/dsh-storage'

    - id: storage-json
      name: '@deepseek-ai/dsh-storage-json'
      config:
        root: !!js dshHomePath('storages')

    - id: storage-domain
      name: '@deepseek-ai/dsh-storage-domain'
      config:
        backend: json

    - id: message-feedback
      name: '@deepseek-ai/dsh-message-feedback'
      config:
        maxNoteBytes: 8192

    - id: workspace
      name: '@deepseek-ai/dsh-workspace'

    - id: session-projection-cache
      name: '@deepseek-ai/dsh-session-projection-cache'
      config:
        writeEveryEvents: 200
        writeIntervalMs: 5000

    - id: session-reference
      name: '@deepseek-ai/dsh-session-reference'

    - id: file-reference-local
      name: '@deepseek-ai/dsh-file-reference-local'

    - id: session-stats
      name: '@deepseek-ai/dsh-session-stats'

    - id: directory-picker
      name: '@deepseek-ai/dsh-host-directory-picker-native'

    - id: plugin-inventory
      name: '@deepseek-ai/dsh-host-plugin-inventory'

    - id: knowledge-wiki
      name: '@deepseek-ai/dsh-knowledge-wiki'
      config:
        wikiRoot: ''
        mainRoot: ''
        apiKey: ''
        llmProvider: 'deepseek-official'
        llmModel: 'deepseek-v4-flash'

    # Direct root-confined strict Workbench Remote owner.
    - id: workbench-remote
      name: '@deepseek-ai/dsh-host-workbench'

    # Sole Host owner for dynamically registered strict slash Remotes.
    - id: api-gateway
      name: '@deepseek-ai/dsh-api-gateway'

    - id: native-api-startup
      name: '@deepseek-ai/dsh-native-api-app/startup'

    - id: webserver
      name: '@deepseek-ai/dsh-host-webserver'
      inject: [nativeApiStartup]
      config:
        host: '127.0.0.1'
        port: !!js ctx.nativeApiStartup.port ?? 0
        apiToken: !!js process.env.DSH_API_TOKEN
        apiOnly: true

    - id: native-api-runtime
      name: '@deepseek-ai/dsh-native-api-app'

    # Host-only owner of strict /api transport and independent event sockets.
    - id: host-connection
      name: '@deepseek-ai/dsh-host-connection'
      config:
        trustedHosts: []

    - id: agent-presets
      name: '@deepseek-ai/dsh-agent-presets'
      config:
        default: standard

    # Host implementation for the SessionStore-owned generated session/*
    # descriptors and archived Workspace retirement capability.
    - id: session-remote-operations
      name: '@deepseek-ai/dsh-host-session-remote-operations'
      config:
        sessionExportCompressionLevel: 6

    # Sole Native projection and answer-correlation owner; Connection remains
    # transport-only and registers the physical sockets/response path.
    - id: native-events
      name: '@deepseek-ai/dsh-host-native-events'
